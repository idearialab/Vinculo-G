<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vínculo G. | Mi panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#17171b;color:#eee;font:16px system-ui}main{max-width:780px;margin:auto;padding:18px}h1,h2{font-family:Georgia,serif}h1{color:#d5b477}button,select,input{font:inherit}button,select{padding:10px;border:1px solid #a58b61;border-radius:10px;background:#29282d;color:#fff}button{cursor:pointer}nav,.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.controls label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}input[type=color]{width:100%;height:42px;border:0;background:transparent}.frame{padding:22px;border-radius:24px;background-color:var(--bg);background-image:var(--pattern);background-size:36px 36px}.panel{background:var(--panel);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 8px 30px #0003}.hero{text-align:center;position:relative;padding:12px}.sticker{position:absolute;font-size:36px;top:0}.left{left:0}.right{right:0}.crest{font:64px Georgia;border:2px double #c8a66b;border-radius:50%;width:105px;height:105px;display:grid;place-items:center;margin:auto;color:#c8a66b}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--accent);border-radius:12px;padding:18px 8px;text-align:center;color:inherit;background:transparent}.tile span{display:block;font-size:25px;margin-bottom:6px}.note{border:1px solid var(--accent);padding:12px;border-radius:12px;margin:12px 0}small{opacity:.8}a{color:#d5b477}svg{max-width:190px}#symbol svg{background:#e4e0da;border:1px solid #a9a39a;border-radius:14px;padding:8px} [hidden]{display:none!important}
nav a{padding:10px 12px;border:1px solid #79694e;border-radius:10px;text-decoration:none}.tile small{font-size:11px;opacity:.8}.tile:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #d5b477;outline-offset:3px}@media(max-width:380px){main{padding:10px}.frame{padding:10px}.panel{padding:12px}}</style><main hidden id="main"><h1>Vínculo G.</h1><small id="membership">Consultando membresía…</small><nav><a href="/planes.html">Planes y beneficios</a><a href="/stickers.html">Stickers y avisos</a><a href="/acceso.html?settings=1">Configuración</a> <button id="dom">Dominante</button><button id="sub">Sumisa</button><button id="edit">Personalizar</button></nav><section id="archetypeBox" hidden><label>Arquetipo de prueba <select id="archetype"></select></label><p id="titlePreview"></p></section><section id="editor" hidden><div class="controls"><label>Colección<select id="theme"><option>Little (adulta)</option><option>Brat</option><option>Sumisa</option><option>Alfa</option><option>Dominante</option><option>Esclava</option><option>Pet / mascota</option><option>Rope Bunny</option><option>Bimbo</option><option>Personalizado</option></select></label><label>Fondo<input type="color" id="bg"></label><label>Recuadro<input type="color" id="panel"></label><label>Texto<input type="color" id="ink"></label><label>Acentos<input type="color" id="accent"></label><label>Mosaico<select id="pattern"><option>Flores</option><option>Diamantes</option><option>Puntos</option><option>Liso</option><option>Terciopelo</option><option>Cuero acolchado</option><option>Encaje geométrico</option><option>Mármol</option></select></label><label>Imagen propia<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Escala del mosaico<input id="scale" type="range" min="16" max="100" value="36"></label><label>Sticker izquierdo<select id="left"></select></label><label>Sticker derecho<select id="right"></select></label><label>Sticker inferior<select id="bottom"></select></label></div><button id="saveTheme">Guardar en este dispositivo</button> <button id="resetTheme">Restablecer</button><p id="themeStatus" role="status"></p></section><div class="frame" id="frame"><section class="panel"><header class="hero"><span class="sticker left" id="sl"></span><span class="sticker right" id="sr"></span><div id="symbol"></div><h2 id="name"></h2><p id="role"></p></header><div class="note" id="notice"></div><div class="tiles" id="tiles"></div><p style="text-align:center;font-size:32px" id="sb"></p><div class="note" id="detail" hidden role="status"></div></section></div><p><a href="/">Volver a la portada</a></p></main><script>
const $=x=>document.getElementById(x),themes=[['#f6a9cd','#fff1f7','#78334f','#c44b87','🐇','🌷','🦋'],['#8b4de0','#eee0ff','#46226d','#7b36c6','⚡','💜','⭐'],['#70162e','#2d1720','#ffe4ec','#e28a9e','🌹','🖤','🌙'],['#243b63','#e0e9f5','#21334d','#829bc3','','',''],['#161719','#252529','#f1e2c8','#c8a66b','','',''],['#151515','#424247','#ffffff','#b9bdc5','','',''],['#477e72','#e0f3e9','#23483e','#477e72','','',''],['#ac7951','#f4e5d2','#563821','#ac7951','','',''],['#b78caa','#fff3e9','#69435e','#a47a39','','',''],['#53565e','#eeeef0','#30323a','#737783','','','']];let role='dom',account=null,entitlements=null,photo='',plan='free';const keys=['bg','panel','ink','accent','pattern','left','right','bottom','scale'];const premiumPatterns=['Terciopelo','Cuero acolchado','Encaje geométrico','Mármol'];function themeKey(){return 'vinculo-theme:'+String(account.id||account.username||account.name)+':'+role}function restore(){if(!entitlements?.colors)return;try{const t=JSON.parse(localStorage.getItem(themeKey())||'null');if(t){for(const k of keys)if(typeof t[k]==='string')$(k).value=t[k];photo=typeof t.photo==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(t.photo)?t.photo:'';paint()}}catch{}}const stickers=['','🐇','🌷','🦋','🐥','🌿','🌻','🐈','🐾','🌹','💜','⭐','🍓','🧸','🌙','🍄','👑','💎','🎀','🐚','⚡','🖤'];for(const id of ['left','right','bottom'])for(const s of stickers)$(id).add(new Option(s||'Sin adorno',s));function apply(i){const t=themes[i];['bg','panel','ink','accent','left','right','bottom'].forEach((k,j)=>$(k).value=t[j]);paint()}function paint(){for(const k of ['bg','panel','ink','accent'])$('frame').style.setProperty('--'+k,$(k).value);let p=$('pattern').value;if(premiumPatterns.includes(p)&&!entitlements?.exclusivePatterns)p='Liso';const paths={Flores:'<circle cx="18" cy="18" r="3"/><circle cx="18" cy="11" r="4"/><circle cx="25" cy="18" r="4"/><circle cx="18" cy="25" r="4"/><circle cx="11" cy="18" r="4"/>',Diamantes:'<path d="M18 5L30 18 18 31 6 18Z"/>',Puntos:'<circle cx="18" cy="18" r="3"/>'};$('frame').style.setProperty('--pattern',p==='Liso'?'none':'url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><g fill="none" stroke="white" opacity=".35">'+paths[p]+'</g></svg>')+'")');const textures={'Terciopelo':'radial-gradient(ellipse at 30% 30%,#ffffff25,transparent 65%),repeating-linear-gradient(115deg,#0002 0 1px,transparent 1px 4px)','Cuero acolchado':'repeating-linear-gradient(45deg,transparent 0 22px,#0005 23px 25px),repeating-linear-gradient(-45deg,transparent 0 22px,#fff3 23px 25px)','Encaje geométrico':'repeating-radial-gradient(circle,transparent 0 8px,#fff4 9px 10px,transparent 11px 17px)','Mármol':'repeating-linear-gradient(125deg,transparent 0 20px,#fff3 23px,#0002 25px,transparent 31px 65px)'};if(textures[p])$('frame').style.setProperty('--pattern',textures[p]);if(photo&&entitlements?.colors)$('frame').style.setProperty('--pattern','url("'+photo+'")');$('frame').style.backgroundSize=photo&&entitlements?.colors?'cover':$('scale').value+'px '+$('scale').value+'px';['sl','sr','sb'].forEach((k,i)=>$(k).textContent=$(['left','right','bottom'][i]).value)}function render(r){if(!account||(!account.founder&&r!==(account.role==='dominant'?'dom':'sub')))return;role=r;$('archetypeBox').hidden=r!=='sub';$('theme').selectedIndex=r==='dom'?4:({Sumisa:2,Esclava:5,Brat:1,'Pet / mascota':6,'Little (adulta)':0,'Rope Bunny':7,Bimbo:8,Alfa:3,Personalizado:9}[$('archetype').value]??2);$('pattern').value=r==='dom'?'Diamantes':'Flores';photo='';$('scale').value='36';apply($('theme').selectedIndex);restore();$('name').textContent=account.founder&&r==='sub'?'Luna (prueba)':account.name;$('role').textContent=r==='dom'?(account.founder?'Fundador · Dominante':'Dominante'):(account.founder?'Vista de prueba · Sumisa':'Sumisa');$('symbol').innerHTML=r==='dom'?'<div class="crest">G</div>':'<svg viewBox="0 0 200 95"><ellipse cx="100" cy="30" rx="75" ry="20" fill="none" stroke="#555" stroke-width="14"/><path d="M25 30Q100 76 175 30" fill="none" stroke="#242126" stroke-width="19"/><circle cx="100" cy="70" r="14" fill="none" stroke="#c8a66b" stroke-width="6"/></svg>';$('notice').textContent=r==='dom'?'Organiza tus vínculos y acuerdos':'Tu espacio personal · privacidad y acuerdos';$('tiles').replaceChildren();const items=r==='dom'?['♔|Mis vínculos','▦|Agenda','✓|Actividades','◇|Acuerdos','♧|Familias','◇|Diseñador de collares','▤|Academia','▤|Mi diario','♡|Afinidades','⚙|Administración']:['♔|Mis vínculos','✓|Mis actividades','▦|Mi agenda','◇|Mis acuerdos','☆|Reconocimientos','◇|Diseñador de collares','▤|Mi diario','♧|Academia','♡|Afinidades','☏|Asesorías'];for(const item of items){if(item.includes('Administración')&&(!account.founder||r==='sub'))continue;const [i,n]=item.split('|'),b=document.createElement('button'),s=document.createElement('span');b.className='tile';s.textContent=i;b.append(s,document.createTextNode(n));const required={'Familias':['groups','Premium'],'Diseñador de collares':['collarDesigner','Plus']}[n];const locked=required&&entitlements&&!entitlements[required[0]];const meta=document.createElement('small');meta.style.display='block';meta.style.marginTop='7px';meta.textContent=locked?'Disponible en '+required[1]:['Mis vínculos','Diseñador de collares'].includes(n)?'Abrir módulo':'En desarrollo';b.append(meta);b.onclick=()=>{if(['Agenda','Mi agenda'].includes(n)){location.href='/agenda.html';return;}if(n==='Mi diario'){location.href='/diario.html';return;}if(['Actividades','Mis actividades','Reconocimientos'].includes(n)){location.href='/actividades.html';return;}if(['Acuerdos','Mis acuerdos'].includes(n)){location.href='/acuerdos.html';return;}if(n==='Diseñador de collares'){location.href='/collares.html';return;}if(locked){location.href='/planes.html';return;}if(n==='Mis vínculos'&&!(account.founder&&r==='sub')){location.href='/vinculos.html';return;}$('detail').hidden=false;$('detail').textContent=n+' · Módulo visual pendiente de conexión.'};$('tiles').append(b)}$('detail').hidden=true} $('dom').onclick=()=>render('dom');$('sub').onclick=()=>render('sub');$('edit').onclick=()=>{if(!entitlements?.colors){location.href='/planes.html';return}$('editor').hidden=!$('editor').hidden;for(const o of $('pattern').options)o.disabled=premiumPatterns.includes(o.value)&&!entitlements.exclusivePatterns};$('scale').oninput=paint;$('photo').onchange=()=>{const f=$('photo').files[0];if(!entitlements?.colors||!f)return;if(f.size>1000000||!['image/png','image/jpeg','image/webp'].includes(f.type)){$('themeStatus').textContent='Usa PNG, JPEG o WebP de hasta 1 MB.';return}const reader=new FileReader();reader.onload=()=>{photo=reader.result;paint()};reader.readAsDataURL(f)};$('saveTheme').onclick=()=>{if(!entitlements?.colors)return;try{localStorage.setItem(themeKey(),JSON.stringify({...Object.fromEntries(keys.map(k=>[k,$(k).value])),photo}));$('themeStatus').textContent='Guardado en este navegador.'}catch{$('themeStatus').textContent='No hay espacio disponible para guardar.'}};$('resetTheme').onclick=()=>{try{localStorage.removeItem(themeKey())}catch{}photo='';render(role);$('themeStatus').textContent='Diseño restablecido.'};$('theme').onchange=()=>apply($('theme').selectedIndex);for(const k of ['bg','panel','ink','accent','pattern','left','right','bottom'])$(k).oninput=paint;const titles={'Sumisa':'Amo','Esclava':'Amo','Brat':'Daddy','Pet / mascota':'Dueño','Little (adulta)':'Daddy','Rope Bunny':'Rigger','Bimbo':'Lord','Alfa':'Sr.','Personalizado':'Por acordar'};for(const k of Object.keys(titles))$('archetype').add(new Option(k,k));$('archetype').onchange=()=>{if(account&&role==='sub'){const i=({Sumisa:2,Esclava:5,Brat:1,'Pet / mascota':6,'Little (adulta)':0,'Rope Bunny':7,Bimbo:8,Alfa:3,Personalizado:9}[$('archetype').value]??2);$('theme').selectedIndex=i;apply(i)}$('titlePreview').textContent='Tratamiento propuesto: '+titles[$('archetype').value]+' · Vista previa, no guardada'};$('archetype').onchange();fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(u=>{if(!u.ok){location.replace('/acceso.html');return}account=u;fetch('/api/entitlements',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.ok){entitlements=d.permissions;render(role)}$('membership').textContent=d.ok?'Plan: '+({free:'Gratuito',plus:'Plus',premium:'Premium',elite:'Elite',founder:'Fundador'}[d.plan]||'Gratuito'):'Plan no disponible'}).catch(()=>{$('membership').textContent='Plan no disponible'});$('dom').hidden=!u.founder;$('sub').hidden=!u.founder;render(u.role==='dominant'?'dom':'sub');$('main').hidden=false}).catch(()=>{document.body.textContent='No se pudo verificar la sesión. Recarga la página.'});
</script></html>
