<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vínculo G. | Acceso</title><style>body{background:#171719;color:#eee;font:16px system-ui;margin:0;padding:24px}main{max-width:420px;margin:40px auto}h1{color:#d5b477}label{display:block;margin:16px 0 6px}input:not([type=checkbox]),select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #777;background:#252528;color:#fff;font:inherit}button{margin-top:16px;background:#d5b477;color:#171719;cursor:pointer}a{color:#d5b477}small{color:#ccc}</style><main><h1>Vínculo G.</h1><p>Acceso de prueba. Utiliza únicamente datos ficticios.</p><form id="f"><label for="mode">Acción</label><select id="mode"><option value="login">Iniciar sesión</option><option value="register">Crear cuenta</option></select><div id="extra" hidden><label for="alias">Nombre visible</label><input id="alias" maxlength="80"><label for="role">Rol</label><select id="role"><option value="dominant">Dominante</option><option value="submissive">Sumisa</option></select><label><input type="checkbox" id="adult"> Confirmo que tengo 18 años o más</label></div><label for="email" id="identityLabel">Correo o nick</label><input id="email" type="text" required autocomplete="username" autocapitalize="none"><label for="password">Contraseña</label><input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"><button>Continuar</button></form><p id="status" role="status"></p><button id="logout" hidden>Cerrar sesión</button><p><a href="/">Volver a la portada</a></p></main><script>const $=id=>document.getElementById(id);$('mode').onchange=()=>{$('extra').hidden=$('mode').value!=='register';$('email').type=$('extra').hidden?'text':'email';$('identityLabel').textContent=$('extra').hidden?'Correo o nick':'Correo';$('password').autocomplete=$('extra').hidden?'current-password':'new-password'};function show(u){$('status').textContent='Sesión iniciada: '+u.name+' · '+(u.founder?'Fundador':u.role==='dominant'?'Dominante':'Sumisa');$('f').hidden=true;$('logout').hidden=false}async function send(b){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}$('f').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const u=await send({action:$('mode').value,email:$('email').value,password:$('password').value,name:$('alias').value,role:$('role').value,adult:$('adult').checked});if(u.ok){$('password').value='';show(u)}else $('status').textContent=u.error||'Error de acceso'}catch{$('status').textContent='No se pudo conectar'}finally{btn.disabled=false}};$('logout').onclick=async()=>{try{const u=await send({action:'logout'});if(u.ok){$('f').hidden=false;$('logout').hidden=true;$('status').textContent='Sesión cerrada'}}catch{$('status').textContent='No se pudo cerrar sesión'}};fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(u=>{if(u.ok)show(u)}).catch(()=>{});</script></html>
