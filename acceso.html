<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon-192.png"><title>Vínculo G. | Acceso</title><style>body{background:#171719;color:#eee;font:16px system-ui;margin:0;padding:24px}main{max-width:420px;margin:40px auto}h1{color:#d5b477}label{display:block;margin:16px 0 6px}input:not([type=checkbox]),select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #777;background:#252528;color:#fff;font:inherit}button{margin-top:16px;background:#d5b477;color:#171719;cursor:pointer}a{color:#d5b477}small{color:#ccc}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.password-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);margin:0;width:44px;height:40px;padding:8px;background:transparent;color:#d5b477;border:0}.password-wrap svg{width:24px;height:24px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.roles label{position:relative;border:1px solid #777;border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer}.roles label:has(input:checked){border:2px solid #d5b477;background:#382e23}.roles label:last-child:has(input:checked){background:#38273a}.roles strong,.roles small{display:block;margin:8px 0}.roles input{accent-color:#d5b477}.roles label:focus-within{outline:2px solid white}[hidden]{display:none!important}</style><main><img src="/icon-192.png" alt="Vínculo G." width="96" height="96" style="border-radius:16px"><h1>Vínculo G.</h1><p>Acceso de prueba. Utiliza únicamente datos ficticios.</p><form id="f"><label for="mode">Acción</label><select id="mode"><option value="login">Iniciar sesión</option><option value="register">Crear cuenta</option></select><div id="extra" hidden><label for="alias">Nombre visible</label><input id="alias" maxlength="80"><label for="username">Nick de acceso</label><input id="username" minlength="3" maxlength="30" autocomplete="off" placeholder="Tu nick"><fieldset style="border:0;padding:0;margin:16px 0"><legend>Elige tu rol</legend><div class="roles"><label><input type="radio" name="role" value="dominant"><strong>Dominante</strong><small>Liderazgo y responsabilidad</small></label><label><input type="radio" name="role" value="submissive"><strong>Sumisa</strong><small>Entrega voluntaria y autonomía</small></label></div></fieldset><label><input type="checkbox" id="adult"> Confirmo que tengo 18 años o más</label></div><label for="email" id="identityLabel">Correo o nick</label><input id="email" type="text" required autocomplete="username" autocapitalize="none"><label for="password">Contraseña</label><div class="password-wrap"><input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"><button type="button" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eyeSlash" d="M3 3l18 18" visibility="hidden"/></svg></button></div><button>Continuar</button></form><p id="status" role="status"></p><form id="change" hidden><h2>Cambiar contraseña</h2><label for="current">Contraseña actual</label><input id="current" type="password" autocomplete="current-password" required maxlength="128"><label for="next">Nueva contraseña</label><input id="next" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirm">Confirmar nueva contraseña</label><input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button>Guardar cambios</button></form><button id="logout" hidden>Cerrar sesión</button><p><a href="/">Volver a la portada</a></p></main><script>const $=id=>document.getElementById(id);$('togglePassword').onclick=()=>{const visible=$('password').type==='password';$('password').type=visible?'text':'password';$('togglePassword').setAttribute('aria-pressed',String(visible));$('togglePassword').setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');$('eyeSlash').setAttribute('visibility',visible?'visible':'hidden')};$('mode').onchange=()=>{$('extra').hidden=$('mode').value!=='register';$('email').type=$('extra').hidden?'text':'email';$('identityLabel').textContent=$('extra').hidden?'Correo o nick':'Correo';$('password').autocomplete=$('extra').hidden?'current-password':'new-password';for(const el of [$('alias'),$('username'),$('adult'),...document.querySelectorAll('[name=role]')]){el.required=!$('extra').hidden;el.disabled=$('extra').hidden}};if(new URLSearchParams(location.search).get('mode')==='register')$('mode').value='register';$('mode').onchange();function show(u){$('status').textContent='Sesión iniciada: '+u.name+' · '+(u.founder?'Fundador':u.role==='dominant'?'Dominante':'Sumisa');$('f').hidden=true;$('change').hidden=false;$('logout').hidden=false}async function send(b){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}$('f').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button:not([type=button])');btn.disabled=true;try{const u=await send({action:$('mode').value,email:$('email').value,password:$('password').value,name:$('alias').value,username:$('username').value,role:document.querySelector('[name=role]:checked')?.value,adult:$('adult').checked});if(u.ok){$('password').value='';show(u)}else $('status').textContent=u.error||'Error de acceso'}catch{$('status').textContent='No se pudo conectar'}finally{btn.disabled=false}};$('logout').onclick=async()=>{try{const u=await send({action:'logout'});if(u.ok){$('f').hidden=false;$('change').hidden=true;$('change').reset();$('logout').hidden=true;$('status').textContent='Sesión cerrada'}}catch{$('status').textContent='No se pudo cerrar sesión'}};$('change').onsubmit=async e=>{e.preventDefault();if($('next').value!==$('confirm').value){$('status').textContent='Las contraseñas no coinciden';return}const btn=e.target.querySelector('button');btn.disabled=true;try{const u=await send({action:'change_password',current:$('current').value,next:$('next').value});if(u.ok){e.target.reset();e.target.hidden=true;$('logout').hidden=true;$('f').hidden=false;$('status').textContent='Contraseña actualizada. Inicia sesión nuevamente.'}else $('status').textContent=u.error||'No se pudo cambiar'}catch{$('status').textContent='No se pudo conectar'}finally{btn.disabled=false}};fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(u=>{if(u.ok)show(u)}).catch(()=>{});</script></html>
