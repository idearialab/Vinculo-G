<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diario · Vínculo G.</title><style>body{margin:0;background:#17171b;color:#eee;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}h1,h2,a{color:#d5b477}section,article{border:1px solid #79694e;border-radius:14px;padding:16px;margin:12px 0}label{display:block;margin:12px 0}input,textarea,select,button{font:inherit;color:inherit;background:#29282d;border:1px solid #a58b61;border-radius:8px;padding:10px;box-sizing:border-box}textarea,input,select{width:100%}textarea{min-height:150px}button{margin:4px;cursor:pointer}nav{display:flex;flex-wrap:wrap}p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style><main id="main" hidden><a href="/panel.html">Volver al panel</a><h1>Diario y autoconocimiento</h1><p>Prototipo privado: las entradas solo existen en memoria durante esta visita. No se guardan ni se transmiten. No escribas información que necesites conservar.</p><nav id="tabs"></nav><section><h2 id="heading"></h2><p id="intro"></p><label>Ejercicio opcional<select id="prompt"></select></label><p id="question"></p><form id="form"><label>Título<input id="title" maxlength="120" required></label><label>¿Cómo me siento?<select id="mood"><option>Prefiero no indicarlo</option><option>En calma</option><option>Alegre</option><option>Confusión</option><option>Tristeza</option><option>Inquietud</option><option>Otra emoción</option></select></label><label>Mi reflexión<textarea id="body" maxlength="20000" required></textarea></label><label><input style="width:auto" type="checkbox" id="share"> Compartir esta entrada con mi vínculo</label><p id="visibility"></p><button>Guardar borrador temporal</button></form><p id="notice" role="status"></p></section><section><h2>Mi blog · borradores de esta visita</h2><label>Vista<select id="filter"><option value="all">Todas mis entradas</option><option value="shared">Seleccionadas para compartir</option><option value="private">Privadas</option><option value="section">Sección actual</option></select></label><div id="entries"></div></section></main><p id="status">Verificando sesión…</p><script>const $=id=>document.getElementById(id);const sections={'Mi diario personal':['Un espacio solo para ti.','¿Qué siento hoy?','¿Qué necesito y qué puedo hacer por mí?','¿Qué me gustaría expresar sin temor a ser juzgada?'],'Diario compartido':['Prepara una reflexión para compartir si lo deseas. En esta versión no se envía.','¿Qué quiero comunicar a mi vínculo?','¿Qué me hizo sentir cuidado o cuidado de mí?','¿Qué acuerdo me gustaría revisar?'],'Autoconocimiento':['Explora tus preferencias sin obligación de responder.','¿Qué significa para mí mi rol?','¿Qué experiencias despertaron mi interés?','¿Qué límites y deseos reconozco hoy?','¿Qué me ayuda a sentir seguridad y libertad de decidir?'],'Mis secretos':['Puedes escribir, omitir o detenerte. No tienes que revelar experiencias difíciles a nadie.','¿Hay algo que deseo comprender para mí?','¿Qué quisiera contar, si algún día decido hacerlo?','¿Qué apoyo me gustaría recibir?'],'Mi evolución':['Reflexiona sobre tus propias metas, sin calificaciones.','¿Qué he aprendido sobre mí?','¿Qué cambios deseo conservar?','¿Qué necesito ajustar o dejar atrás?']};let current=Object.keys(sections)[0],entries=[];function visibility(){const shared=current==='Diario compartido';if(shared)$('share').checked=true;$('share').disabled=shared;$('visibility').textContent=$('share').checked?'Destinada al blog compartido. En esta prueba no se transmite.':'Solo para mí.'} $('share').onchange=visibility;$('filter').onchange=()=>showEntries();function render(){visibility(); $('heading').textContent=current;$('intro').textContent=sections[current][0];$('prompt').replaceChildren(new Option('Escritura libre',''));for(const q of sections[current].slice(1))$('prompt').add(new Option(q,q));$('question').textContent='';showEntries()}function showEntries(){ $('entries').replaceChildren();for(const e of entries.filter(e=>{const f=$('filter').value;return f==='all'||(f==='shared'&&e.share)||(f==='private'&&!e.share)||(f==='section'&&e.section===current)})){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('p'),del=document.createElement('button');h.textContent=e.title;p.textContent=e.date+' · '+e.section+' · '+e.mood+' · '+(e.share?'Seleccionada para compartir':'Privada');b.textContent=e.body;del.textContent='Eliminar borrador';del.onclick=()=>{entries=entries.filter(x=>x.id!==e.id);showEntries()};const toggle=document.createElement('button');toggle.textContent=e.share?'Mantener privada':'Seleccionar para compartir';toggle.onclick=()=>{e.share=!e.share;showEntries()};a.append(h,p,b,toggle,del);$('entries').append(a)}}for(const k of Object.keys(sections)){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(($('body').value||$('title').value)&&!confirm('¿Cambiar sección y descartar el texto sin guardar?'))return;$('form').reset();current=k;render()};$('tabs').append(b)}$('prompt').onchange=()=>{$('question').textContent=$('prompt').value};$('form').onsubmit=e=>{e.preventDefault();entries.unshift({id:crypto.randomUUID(),section:current,share:$('share').checked,title:$('title').value,mood:$('mood').value,body:$('body').value,date:new Date().toLocaleString('es-MX')});$('form').reset();visibility();$('notice').textContent='Borrador temporal creado. No se ha compartido.';showEntries()};fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok){location.replace('/acceso.html');return}$('main').hidden=false;$('status').hidden=true;render()}).catch(()=>{$('status').textContent='No se pudo verificar la sesión.'});</script></html>
