<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis vínculos · Vínculo G.</title><style>body{background:#17171b;color:#eee;font:16px system-ui;margin:0}main{max-width:640px;margin:auto;padding:20px}h1,h2,a{color:#d5b477}section{border:1px solid #79694e;border-radius:14px;padding:16px;margin:16px 0}button,input{font:inherit;padding:12px;border:1px solid #a58b61;border-radius:8px;background:#29282d;color:white;margin:5px 0;max-width:100%;box-sizing:border-box}input{width:100%}button{cursor:pointer}button:disabled{opacity:.5}p{overflow-wrap:anywhere}[hidden]{display:none!important}</style><main><a href="/panel.html">← Panel principal</a><h1>Mis vínculos</h1><p id="status" role="status">Verificando sesión…</p><section id="dom" hidden><h2>Invitar</h2><p id="plan"></p><button id="create">Generar código</button><p id="generated"></p><button id="copy" hidden>Copiar código</button><p>Vigencia de 48 horas. Comparte únicamente con la persona que deseas invitar.</p><div id="invites"></div></section><section id="sub" hidden><h2>Recibir invitación</h2><label for="code">Código privado</label><input id="code" autocomplete="off"><button id="preview">Consultar invitación</button><div id="decision" hidden><p id="person"></p><p>Aceptar no implica renunciar a tus límites ni a tu derecho a finalizar el vínculo.</p><button id="accept">Aceptar vínculo</button> <button id="reject">Rechazar invitación</button></div></section><section id="relations" hidden><h2>Relaciones activas</h2><div id="list"></div></section></main><script>
const $=id=>document.getElementById(id);let pending='',generated='',busy=false;
async function api(body){const r=await fetch('/api/links',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});if(r.status===401){location.replace('/acceso.html');throw Error('Sesión requerida')}const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Error de servicio');return d}
function row(parent,label,action,fn){const p=document.createElement('p'),b=document.createElement('button');p.textContent=label+' ';b.textContent=action;b.onclick=()=>run(fn);p.append(b);parent.append(p)}
async function load(){const d=await api();$('plan').textContent=d.plan?d.plan.name+' · Créditos: '+(d.plan.available_credits===-1?'Ilimitados':d.plan.available_credits+d.plan.purchased_credits)+' · Vínculos: '+d.links.length+' / '+(d.plan.max_relationships===-1?'Sin límite':d.plan.max_relationships):'Plan no disponible';$('dom').hidden=d.role!=='dominant';$('sub').hidden=d.role!=='submissive';$('relations').hidden=false;$('list').replaceChildren();$('invites').replaceChildren();if(!d.links.length)$('list').textContent='No hay relaciones activas.';for(const l of d.links)row($('list'),l.name,'Finalizar vínculo',async()=>{if(confirm('¿Deseas finalizar este vínculo?')){await api({action:'end',id:l.id});await load()}});for(const i of d.invites)row($('invites'),'Pendiente hasta '+new Date(i.expires_at).toLocaleString(),'Cancelar',async()=>{if(confirm('¿Cancelar invitación?')){await api({action:'revoke',id:i.id});await load()}})}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('create').onclick=()=>run(async()=>{const d=await api({action:'create'});generated=d.code;$('generated').textContent=generated;$('copy').hidden=false;await load()});$('copy').onclick=()=>run(async()=>{await navigator.clipboard.writeText(generated)});$('code').oninput=()=>{pending='';$('decision').hidden=true};$('preview').onclick=()=>run(async()=>{const code=$('code').value.trim();const d=await api({action:'preview',code});if(code!==$('code').value.trim())return;pending=code;$('person').textContent='Invitación de '+d.name;$('decision').hidden=false});for(const action of ['accept','reject'])$(action).onclick=()=>run(async()=>{if(!pending)return;if(!confirm(action==='accept'?'¿Aceptar voluntariamente este vínculo?':'¿Rechazar esta invitación?'))return;await api({action,code:pending,confirm:true});pending='';$('code').value='';$('decision').hidden=true;await load()});run(load);
</script></html>
