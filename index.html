<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211b25"><link rel="manifest" href="manifest.webmanifest"><title>Vínculo G.</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#211b25);color:var(--fg,#f6eee5);font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}header{text-align:center;padding:24px}h1{font:40px Georgia;color:#c5a36a;margin:0}section{border:1px solid #a98b5666;border-radius:16px;padding:18px;margin:14px 0}button,input,select,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #a98b56}button{background:#c5a36a;color:#211b25;cursor:pointer;margin:4px}input,textarea,select{max-width:100%;background:#fff;color:#222}textarea{width:100%;min-height:100px}label{display:block;margin:10px 0}nav{display:flex;flex-wrap:wrap;justify-content:center}small{opacity:.8}li{margin:10px 0}svg{width:100%;max-width:300px;display:block;margin:auto}</style><main><header><h1>𝓖 · Vínculo</h1><p>Formación, confianza y conexión</p><small>Prototipo local · Solo adultos · Utiliza datos ficticios</small></header><nav id="nav"></nav><div id="view"></div></main><script>
const $=s=>document.querySelector(s);const state={tasks:[{name:'Leer una lección',done:false},{name:'Reflexión personal',done:false}],entries:[],paused:false,color:'#202020',plate:'Corazón',theme:'Clásico',rules:'',accepted:false};let page='Inicio';const pages=['Inicio','Actividades','Acuerdos','Diario','Academia','Collar','Planes'];const el=(tag,text,parent)=>{let n=document.createElement(tag);n.textContent=text;parent.append(n);return n};function button(t,fn,p){let b=el('button',t,p);b.onclick=fn;return b}function section(t){let s=el('section','',$('#view'));el('h2',t,s);return s}function render(){let v=$('#view');v.replaceChildren();if(page==='Inicio'){let s=section('Mi espacio');el('p',state.paused?'Dinámica pausada':'Dinámica de demostración',s);button(state.paused?'Reanudar':'Pausar dinámica',()=>{state.paused=!state.paused;render()},s);let theme=el('select','',s);['Clásico','Romántico','Natural','Celestial'].forEach(x=>el('option',x,theme));theme.value=state.theme;theme.onchange=()=>{state.theme=theme.value;let c={Clásico:['#211b25','#f6eee5'],Romántico:['#f8e4e9','#693248'],Natural:['#e6eddf','#34472e'],Celestial:['#e2eaf9','#29446d']}[theme.value];document.body.style.setProperty('--bg',c[0]);document.body.style.setProperty('--fg',c[1])};el('p','Este prototipo no conecta cuentas ni almacena información íntima.',s)}
if(page==='Actividades'){let s=section('Actividades acordadas');state.tasks.forEach(t=>{let l=el('label','',s),c=el('input','',l);c.type='checkbox';c.checked=t.done;c.disabled=state.paused;c.onchange=()=>{t.done=c.checked;render()};l.append(' '+t.name)});el('p',state.tasks.filter(t=>t.done).length+' de '+state.tasks.length+' completadas',s);let i=el('input','',s);i.placeholder='Proponer actividad';button('Agregar a la demostración',()=>{if(i.value.trim()){state.tasks.push({name:i.value.trim(),done:false});render()}},s);el('p','Las actividades pendientes se pueden revisar o renegociar sin sanciones automáticas.',s)}
if(page==='Acuerdos'){let s=section('Reglamento');let t=el('textarea','',s);t.value=state.rules;t.placeholder='Reglamento de la Academia pendiente de importar';button('Guardar propuesta',()=>{state.rules=t.value;state.accepted=false;render()},s);button(state.accepted?'Retirar aceptación':'Aceptar propuesta de prueba',()=>{state.accepted=!state.accepted;render()},s);el('p',state.accepted?'Aceptado en demostración':'Pendiente de aceptación',s)}
if(page==='Diario'){let s=section('Autoconocimiento');el('p','¿Qué necesito para sentir confianza y libertad en mi vínculo?',s);let t=el('textarea','',s);t.placeholder='Escribe únicamente texto ficticio';let l=el('label','',s),c=el('input','',l);c.type='checkbox';l.append(' Autorizar compartir esta entrada (simulación)');button('Guardar durante esta sesión',()=>{if(t.value.trim()){state.entries.push({text:t.value,shared:c.checked});render()}},s);state.entries.forEach((e,i)=>{let a=el('section','',s);el('small',e.shared?'Compartida (simulación)':'Privada',a);el('p',e.text,a);button(e.shared?'Retirar permiso':'Autorizar compartir',()=>{e.shared=!e.shared;render()},a);button('Eliminar',()=>{state.entries.splice(i,1);render()},a)})}
if(page==='Academia'){let s=section('Formación');el('p','Pendiente de incorporar las lecciones y el test originales de Dom G.',s);for(let i=1;i<=5;i++)el('p','Nivel '+i+' · Pendiente de importar',s)}
if(page==='Collar'){let s=section('Diseña tu collar virtual');let preview=el('div','',s);let draw=()=>{preview.replaceChildren();let band=el('div','',preview);band.style.cssText='margin:20px auto 0;width:220px;height:60px;border:18px solid '+state.color+';border-radius:50%';let p=el('div',{'Corazón':'♥','Círculo':'●','Cuadrado':'■','Huesito':'🦴','Aro':'○','Candado':'🔒'}[state.plate],preview);p.style.cssText='text-align:center;font-size:42px;color:#c5a36a'};let c=el('input','',s);c.type='color';c.value=state.color;c.oninput=()=>{state.color=c.value;draw()};let p=el('select','',s);['Círculo','Cuadrado','Huesito','Corazón','Aro','Candado'].forEach(x=>el('option',x,p));p.value=state.plate;p.onchange=()=>{state.plate=p.value;draw()};draw()}
if(page==='Planes'){let s=section('Planes propuestos');['Exploración · Gratis','Esencial · $69 MXN/mes','Plus · $129 MXN/mes','Premium · $249 MXN/mes','Fundador · Sin cuota'].forEach(x=>el('p',x,s));el('small','Sin cobros ni suscripciones activas.',s)}}
pages.forEach(p=>button(p,()=>{page=p;render()},$('#nav')));render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
