<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Formación G.</title><style>body{background:#171719;color:#eee;font:16px system-ui;margin:0}main{max-width:680px;margin:auto;padding:20px}h1,h2,a{color:#d5b477}section{border:1px solid #79694e;border-radius:14px;padding:16px;margin:14px 0}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #a58b61;background:#29282d;color:#eee;box-sizing:border-box}button{cursor:pointer;margin:6px 0}input{width:100%}[hidden]{display:none!important}</style><main><a href="/panel.html">Volver al panel</a><h1 id="title">Formación G.</h1><p id="status" role="status">Verificando sesión…</p><section id="teacher" hidden><h2>Invitar pupila</h2><button id="create">Generar invitación</button><div id="generated" hidden><input id="link" readonly aria-label="Enlace privado"><button id="copy">Copiar enlace</button><button id="share">Compartir enlace</button><p>Válido 48 horas, un solo uso. Envíalo únicamente a la destinataria.</p></div></section><section id="student" hidden><h2>Invitación académica</h2><input id="code" maxlength="32" placeholder="Código de invitación"><button id="preview">Consultar invitación</button><div id="confirm" hidden><p id="inviter"></p><label><input type="checkbox" id="agree" style="width:auto"> Acepto voluntariamente la mentoría académica. No implica un vínculo personal.</label><br><button id="accept">Aceptar mentoría</button></div></section><section id="list" hidden><h2>Mis mentorías</h2><div id="rows"></div><a href="/academia.html">Ir a la Academia</a></section></main><script>const $=id=>document.getElementById(id);const code=new URLSearchParams(location.hash.slice(1)).get('mentoria')||'';if(code)history.replaceState(null,'',location.pathname);let busy=false,verified='';async function api(b){const r=await fetch('/api/mentorships',b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Error de conexión');return d}async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){$('status').textContent=e.message}finally{busy=false}}async function load(){const d=await api();$('title').textContent=d.founder?'Mis pupilas':'Mi Maestro';$('teacher').hidden=!d.founder;$('student').hidden=d.founder;$('list').hidden=false;$('status').textContent='';$('rows').replaceChildren();if(!d.mentorships.length)$('rows').textContent='Sin mentorías todavía.';for(const m of d.mentorships){const s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=m.name;p.textContent=({active:'Activa',paused:'En pausa',completed:'Completada',ended:'Finalizada'})[m.status]||m.status;s.append(h,p);if(!m.ended_at){const b=document.createElement('button');b.textContent='Finalizar mentoría';b.onclick=()=>{if(window.confirm('¿Finalizar esta mentoría? Tu cuenta seguirá activa.'))run(async()=>{await api({action:'end',id:m.id});await load()})};s.append(b)}$('rows').append(s)}}$('create').onclick=()=>run(async()=>{const d=await api({action:'create'});$('link').value=location.origin+'/acceso.html#mentoria='+d.code;$('generated').hidden=false});$('copy').onclick=()=>run(async()=>{await navigator.clipboard.writeText($('link').value);$('status').textContent='Enlace copiado'});$('share').onclick=()=>run(async()=>{if(navigator.share)await navigator.share({title:'Invitación privada',url:$('link').value});else await navigator.clipboard.writeText($('link').value)});$('code').oninput=()=>{verified='';$('confirm').hidden=true;$('agree').checked=false};$('preview').onclick=()=>run(async()=>{verified='';$('confirm').hidden=true;$('agree').checked=false;const c=$('code').value.trim();const d=await api({action:'preview',code:c});verified=c;$('inviter').textContent='Invitación académica de '+d.name;$('confirm').hidden=false});$('accept').onclick=()=>run(async()=>{if(!$('agree').checked||!verified||verified!==$('code').value.trim())throw Error('Confirma la invitación');await api({action:'accept',code:verified,confirm:true});verified='';$('code').value='';$('confirm').hidden=true;await load();$('status').textContent='Mentoría aceptada'});fetch('/api/auth',{cache:'no-store'}).then(r=>r.json()).then(async u=>{if(!u.ok){location.replace('/acceso.html'+(code?'#mentoria='+encodeURIComponent(code):''));return}await load();if(code&&!u.founder){$('code').value=code;$('preview').click()}}).catch(e=>{$('status').textContent=e.message||'No se pudo conectar'});</script></html>
