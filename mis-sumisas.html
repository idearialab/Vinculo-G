<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis sumisas</title><style>body{background:#171719;color:#eee;font:16px system-ui;margin:0}main{max-width:720px;margin:auto;padding:20px}h1,h2,a{color:#d5b477}article,section{border:1px solid #79694e;border-radius:14px;padding:16px;margin:12px 0}button{font:inherit;background:#29282d;color:#eee;border:1px solid #a58b61;padding:12px;border-radius:8px;margin:4px}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><a href="/panel.html">Volver al panel</a><h1>Mis sumisas</h1><p id="status">Verificando sesión…</p><div id="links"></div><h2 id="name"></h2><div id="entries"></div></main><script>const $=id=>document.getElementById(id);let seq=0;async function get(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.error);return d}async function open(l){const n=++seq;$('entries').replaceChildren();$('name').textContent=l.name+' · Diario compartido';$('status').textContent='Cargando…';try{const d=await get('/api/diary?relationship='+encodeURIComponent(l.id));if(n!==seq)return;$('status').textContent='';if(!d.entries.length)$('entries').textContent='No hay entradas autorizadas para este vínculo.';for(const e of d.entries){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('p');h.textContent=e.title;p.textContent=e.section+' · '+new Date(e.created_at).toLocaleString('es-MX')+' · '+e.mood;b.textContent=e.body+(e.interest?'\nInterés: '+e.interest+'\nInspiración: '+e.inspiration:'');a.append(h,p,b);$('entries').append(a)}}catch(e){if(n===seq)$('status').textContent=e.message}}get('/api/links').then(d=>{if(d.role!=='dominant'){location.replace('/panel.html');return}$('status').textContent=d.links.length?'Selecciona un vínculo':'Sin vínculos activos';for(const l of d.links){const b=document.createElement('button');b.textContent=l.name;b.onclick=()=>open(l);$('links').append(b)}}).catch(e=>$('status').textContent=e.message);</script></html>
