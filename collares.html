<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collares · Vínculo G.</title><style>*{box-sizing:border-box}body{margin:0;background:#17171b;color:#eee;font:16px system-ui}main{max-width:720px;margin:auto;padding:20px}h1,a{color:#d5b477}section{background:#252529;border:1px solid #79694e;border-radius:18px;padding:18px;margin:16px 0}svg{width:100%;max-height:280px}label{display:flex;flex-direction:column;gap:6px;margin:12px 0}select,input,button{font:inherit;color:inherit;background:#17171b;border:1px solid #a58b61;border-radius:8px;padding:10px}input[type=color]{width:100%;height:44px;padding:3px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}small{color:#ccc}[hidden]{display:none!important}</style><main hidden id="main"><a href="/panel.html">← Panel principal</a><h1>Estudio de collares</h1><p id="membership"></p><section><svg id="preview" viewBox="0 0 320 220" role="img" aria-label="Vista previa de collar simbólico"><defs><linearGradient id="shine" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs><ellipse cx="160" cy="82" rx="112" ry="42" fill="none" stroke="#555" stroke-width="22"/><path id="band" d="M48 82 Q160 166 272 82" fill="none" stroke="#242126" stroke-width="29" stroke-linecap="round"/><path id="highlight" d="M48 82 Q160 166 272 82" fill="none" stroke="url(#shine)" stroke-width="25" stroke-linecap="round"/><path id="stitch" d="M49 82 Q160 166 271 82" fill="none" stroke="#ffffff55" stroke-width="1.5" stroke-dasharray="3 5"/><g id="plate" stroke="#c8a66b" fill="#c8a66b" stroke-width="4"></g><text id="engraved" x="160" y="160" font-size="12" font-family="Georgia" text-anchor="middle" fill="#17171b"></text></svg><p id="description"></p></section><section><label>Arquetipo<select id="preset"></select></label><div class="fields"><label>Material<select id="material"><option>Cuero</option><option>Metal</option><option>Terciopelo</option><option>Cuerda decorativa</option><option>Perlas</option></select></label><label>Color<input id="color" type="color" value="#242126"></label><label>Acabado metálico<select id="metal"><option value="#c8a66b">Dorado</option><option value="#c4c9ce">Plateado</option><option value="#b77b62">Cobre</option><option value="#55555d">Grafito</option></select></label><label>Placa<select id="shape"><option>Argolla</option><option>Círculo</option><option>Cuadrado</option><option>Corazón</option><option>Hueso</option><option>Candado simbólico</option><option>Sin placa</option></select></label></div><label>Grabado (máximo 12 caracteres)<input id="engraving" maxlength="12" placeholder="Iniciales o nombre"></label><button id="reset">Restaurar diseño</button> <button id="save" hidden>Exportar diseño SVG</button><p id="notice"></p><a id="upgrade" href="/planes.html" hidden>Consultar planes</a></section></main><p id="status" role="status">Verificando sesión…</p><script>
const $=id=>document.getElementById(id),presets={'Sumisa':['Cuero','#242126','#c8a66b','Argolla'],'Esclava':['Metal','#bfc5cb','#c4c9ce','Argolla'],'Brat':['Cuero','#783db4','#c4c9ce','Corazón'],'Pet / mascota':['Cuero','#b66d43','#c8a66b','Hueso'],'Little (adulta)':['Terciopelo','#e8a4bf','#c8a66b','Corazón'],'Rope Bunny':['Cuerda decorativa','#bda07b','#c8a66b','Círculo'],'Bimbo':['Perlas','#f0e5d8','#c8a66b','Corazón'],'Alfa':['Terciopelo','#202020','#c4c9ce','Sin placa'],'Consideración':['Cuero','#245bb2','#c4c9ce','Círculo'],'Entrenamiento':['Cuero','#794a31','#c8a66b','Cuadrado'],'Personalizado':['Cuero','#242126','#c8a66b','Círculo']};for(const name of Object.keys(presets))$('preset').add(new Option(name,name));const shapes={'Argolla':'<circle cx="160" cy="155" r="16" fill="none"/>','Círculo':'<circle cx="160" cy="155" r="23"/>','Cuadrado':'<rect x="133" y="134" width="54" height="42" rx="5"/>','Corazón':'<path d="M160 180 C100 142 144 119 160 140 C176 119 220 142 160 180Z"/>','Hueso':'<path d="M140 145 Q118 125 120 150 Q108 174 140 165 H180 Q212 174 200 150 Q202 125 180 145Z"/>','Candado simbólico':'<path d="M147 144 V136 A13 13 0 0 1 173 136 V144" fill="none"/><rect x="136" y="144" width="48" height="36" rx="5"/>','Sin placa':''};function paint(){const m=$('material').value,s=$('shape').value;$('band').setAttribute('stroke',$('color').value);$('band').setAttribute('stroke-width',m==='Metal'?19:m==='Cuerda decorativa'?17:29);$('highlight').setAttribute('stroke-width',m==='Metal'?16:m==='Cuerda decorativa'?12:25);$('stitch').setAttribute('stroke-dasharray',m==='Perlas'?'1 9':m==='Cuerda decorativa'?'2 3':'3 5');$('stitch').setAttribute('stroke-width',m==='Perlas'?12:1.5);$('plate').setAttribute('stroke',$('metal').value);$('plate').setAttribute('fill',$('metal').value);$('plate').innerHTML=shapes[s];$('engraved').textContent=['Argolla','Sin placa'].includes(s)?'':$('engraving').value;$('description').textContent=$('preset').value+' · '+m+' · '+s;}function preset(){const p=presets[$('preset').value];['material','color','metal','shape'].forEach((id,i)=>$(id).value=p[i]);$('engraving').value='';paint()}$('preset').onchange=preset;$('reset').onclick=preset;for(const id of ['material','color','metal','shape','engraving'])$(id).oninput=paint;$('save').onclick=()=>{const svg=$('preview').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='collar-vinculo-g.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};preset();fetch('/api/entitlements',{cache:'no-store'}).then(r=>{if(r.status===401){location.replace('/acceso.html');throw Error('Sesión requerida')}return r.json()}).then(d=>{if(!d.ok)throw Error('No se pudo consultar tu plan');$('main').hidden=false;$('status').hidden=true;$('membership').textContent='Plan: '+d.plan;$('save').hidden=!d.permissions.collarDesigner;$('upgrade').hidden=d.permissions.collarDesigner;$('notice').textContent=d.permissions.collarDesigner?'Puedes exportar tu diseño. El guardado en tu perfil todavía está pendiente.':'Vista previa gratuita. Exportación y personalización de perfil desde Plus.'}).catch(e=>$('status').textContent=e.message);
</script></html>
