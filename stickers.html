<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickers · Vínculo G.</title><style>body{background:#17171b;color:#eee;font:16px system-ui;margin:0}main{max-width:720px;margin:auto;padding:20px}h1,h2,a{color:#d5b477}section{border:1px solid #79694e;border-radius:14px;padding:16px;margin:14px 0}button,select,input{font:inherit;color:inherit;background:#29282d;border:1px solid #a58b61;border-radius:8px;padding:8px}label{display:block;margin:12px 0}#library{display:flex;flex-wrap:wrap;gap:8px}#library button{font-size:28px}#preview{height:220px;background:#f1e5d9;position:relative;overflow:hidden;border-radius:12px}#sticker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1}#sticker img{width:100%;height:100%;object-fit:contain}[hidden]{display:none!important}</style><main id="main" hidden><a href="/panel.html">Volver al panel</a><h1>Biblioteca de stickers</h1><p id="plan"></p><section><label>Colección <select id="collection"></select></label><div id="library"></div><label id="uploadLabel">Sticker propio (PNG, WebP, JPEG; máximo 1 MB)<input id="upload" type="file" accept="image/png,image/webp,image/jpeg"></label><div id="preview"><div id="sticker"></div></div><label>Tamaño <input id="size" type="range" min="20" max="150" value="65"></label><label>Posición horizontal <input id="x" type="range" min="0" max="100" value="50"></label><label>Posición vertical <input id="y" type="range" min="0" max="100" value="50"></label><label>Rotación <input id="rotation" type="range" min="-180" max="180" value="0"></label><button id="clear">Quitar sticker</button><p>Vista previa local; todavía no se guarda en el panel ni se comparte con otros usuarios.</p></section><section><h2>Estoy pensando en ti</h2><label><input id="receive" type="checkbox" checked> Recibir avisos afectivos</label><label><input id="vibrate" type="checkbox"> Vibración opcional</label><button id="test">Probar aviso en este dispositivo</button><p id="notice" role="status"></p><small>Prueba local sin envío a otra cuenta. Sin sonido. La vibración depende del dispositivo y navegador.</small></section></main><p id="status">Verificando sesión…</p><script>const $=x=>document.getElementById(x),groups={'Little (adulta)':['🧸','🎀','🌈','🦄','🍭'],'Brat':['😈','⚡','💜','🔥','👑'],'Esclava':['🖤','🔗','🗝️','🌑','⛓️'],'Sumisa':['🌹','🦋','❤️','🌙','💌'],'Pet':['🐾','🐈','🐕','🐇','🦊'],'Rope Bunny':['🪢','🐇','🧶','🌸','🎗️'],'Bimbo':['💄','💎','💋','👛','✨'],'Alfa':['👑','🐺','♟️','🦅','⚜️'],'Dominante':['♛','🦁','🛡️','🗝️','♠️']};let limit=10,custom=false;function paint(){const s=$('sticker'),z=$('size').value;s.style.fontSize=z+'px';s.style.width=z+'px';s.style.height=z+'px';s.style.left=$('x').value+'%';s.style.top=$('y').value+'%';s.style.transform='translate(-50%,-50%) rotate('+$('rotation').value+'deg)'}function library(){const allowed=Object.values(groups).flat().slice(0,limit===-1?999:limit);$('library').replaceChildren();for(const v of groups[$('collection').value]||[]){const b=document.createElement('button');b.textContent=v;b.disabled=!allowed.includes(v);b.onclick=()=>{$('sticker').textContent=v;paint()};$('library').append(b)}}for(const k of Object.keys(groups))$('collection').add(new Option(k,k));$('collection').onchange=library;for(const k of ['size','x','y','rotation'])$(k).oninput=paint;$('clear').onclick=()=>$('sticker').replaceChildren();$('upload').onchange=()=>{const f=$('upload').files[0];if(!custom||!f||f.size>1000000||!['image/png','image/webp','image/jpeg'].includes(f.type))return;const reader=new FileReader();reader.onload=()=>{const img=document.createElement('img');img.src=reader.result;$('sticker').replaceChildren(img);paint()};reader.readAsDataURL(f)};$('test').onclick=()=>{if(!$('receive').checked){$('notice').textContent='Avisos desactivados';return}$('notice').textContent='Tu vínculo está pensando en ti · aviso de prueba';if($('vibrate').checked&&navigator.vibrate)navigator.vibrate(600)};fetch('/api/entitlements',{cache:'no-store'}).then(r=>{if(r.status===401)location.replace('/acceso.html');return r.json()}).then(d=>{if(!d.ok)throw Error('Plan no disponible');limit=d.permissions.stickerLimit;custom=['premium','elite','founder'].includes(d.plan);$('uploadLabel').hidden=!custom;$('plan').textContent='Plan: '+d.plan;$('main').hidden=false;$('status').hidden=true;library();paint()}).catch(e=>$('status').textContent=e.message);</script></html>
