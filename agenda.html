<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda · Vínculo G.</title><style>body{margin:0;background:#17171b;color:#eee;font:16px system-ui}main{max-width:850px;margin:auto;padding:18px}h1,h2,a{color:#d5b477}section,article{border:1px solid #79694e;border-radius:12px;padding:14px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;color:inherit;background:#29282d;border:1px solid #a58b61;border-radius:8px;padding:9px;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;margin:4px}#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:65px;border:1px solid #555;border-radius:6px;padding:4px;overflow-wrap:anywhere;font-size:12px}.day button{padding:3px;width:100%;margin:2px 0;font-size:11px}small{color:#ccc}[hidden]{display:none!important}</style><main id="main" hidden><a href="/panel.html">Volver al panel</a><h1>Agenda y disponibilidad</h1><p id="plan"></p><p>Prototipo local: los eventos son borradores temporales, no se transmiten ni reservan horarios de otra persona.</p><section><h2>Calendario</h2><button id="prev">Anterior</button><button id="next">Siguiente</button><strong id="month"></strong><label>Filtrar vínculo<select id="filter"><option value="">Todos</option><option value="personal">Personal</option></select></label><div id="calendar"></div></section><section><h2>Nuevo evento</h2><form id="form"><label>Calendario<select id="link"><option value="personal">Personal</option></select></label><label>Tipo<select id="type"><option>Horario disponible</option><option>Compromiso personal</option><option>Actividad propuesta</option><option>Sesión propuesta</option><option>Encuentro propuesto</option><option>Recordatorio</option></select></label><label>Título<input id="title" required maxlength="120"></label><label>Inicio<input id="start" type="datetime-local" required></label><label>Fin<input id="end" type="datetime-local" required></label><label>Color del evento<input id="color" type="color" value="#369b65"></label><label><input style="width:auto" id="busy" type="checkbox"> Compartir solo disponibilidad (sin título ni detalles)</label><button>Crear borrador</button></form><p id="notice" role="status"></p></section><section id="colors"><h2>Identificadores de vínculos</h2><div id="identifiers"></div><small>Los colores identificadores solo cambian tu vista local.</small></section><section><h2>Eventos</h2><div id="events"></div></section></main><p id="status">Verificando sesión…</p><script>const $=id=>document.getElementById(id);let events=[],links=[],month=new Date(),shared=false,colors={};const defaults={'Horario disponible':'#369b65','Compromiso personal':'#929292','Actividad propuesta':'#4285d4','Sesión propuesta':'#9364cf','Encuentro propuesto':'#dc7798','Recordatorio':'#d6a32b'};$('type').onchange=()=>{$('color').value=defaults[$('type').value];if($('type').value==='Compromiso personal')$('busy').checked=true};function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function render(){const f=$('filter').value,visible=events.filter(e=>!f||e.link===f);$('month').textContent=month.toLocaleDateString('es-MX',{month:'long',year:'numeric'});$('calendar').replaceChildren();for(const d of ['L','M','M','J','V','S','D']){const s=document.createElement('strong');s.textContent=d;$('calendar').append(s)}const first=new Date(month.getFullYear(),month.getMonth(),1);for(let i=0;i<(first.getDay()+6)%7;i++)$('calendar').append(document.createElement('div'));for(let n=1;n<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();n++){const cell=document.createElement('div');cell.className='day';cell.textContent=n;const key=dayKey(new Date(month.getFullYear(),month.getMonth(),n));for(const e of visible.filter(e=>e.start.slice(0,10)<=key&&e.end.slice(0,10)>=key)){const b=document.createElement('button');b.textContent=e.title;b.style.borderLeft='5px solid '+(colors[e.link]||e.color);b.style.borderBottom='3px solid '+e.color;b.onclick=()=>document.getElementById('event-'+e.id)?.scrollIntoView();cell.append(b)}$('calendar').append(cell)}$('events').replaceChildren();for(const e of visible.sort((a,b)=>a.start.localeCompare(b.start))){const a=document.createElement('article');a.id='event-'+e.id;a.style.borderLeft='6px solid '+(colors[e.link]||e.color);const h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('button');h.textContent=e.title;p.textContent=e.type+' · '+e.start.replace('T',' ')+' — '+e.end.replace('T',' ')+' · '+(e.busy?'Solo disponibilidad':'Borrador');b.textContent='Eliminar borrador';b.onclick=()=>{events=events.filter(x=>x.id!==e.id);render()};a.append(h,p,b);$('events').append(a)}}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();const start=$('start').value,end=$('end').value,link=$('link').value;if(end<=start){$('notice').textContent='El fin debe ser posterior al inicio.';return}if(link!=='personal'&&!shared)return;events.push({id:crypto.randomUUID(),link,title:$('title').value,type:$('type').value,start,end,color:$('color').value,busy:$('busy').checked});month=new Date(start);$('notice').textContent='Borrador creado. No se ha enviado.';render()};fetch('/api/entitlements',{cache:'no-store'}).then(r=>r.json()).then(async d=>{if(!d.ok){location.replace('/acceso.html');return}shared=!!d.permissions.sharedCalendar;$('plan').textContent=shared?'Agenda compartida disponible en tu plan (prototipo).':'Agenda personal. Agenda compartida desde Plus.';if(shared){const res=await fetch('/api/links',{cache:'no-store'}).then(r=>r.json());links=Array.isArray(res.links)?res.links:[];for(const l of links){if(!l.id)continue;const name=l.nick||l.name||'Vínculo';for(const id of ['link','filter'])$(id).add(new Option(name,l.id));const label=document.createElement('label'),input=document.createElement('input');label.textContent=name;input.type='color';input.value='#'+['9364cf','4285d4','dc7798','369b65','d6a32b'][Object.keys(colors).length%5];colors[l.id]=input.value;input.oninput=()=>{colors[l.id]=input.value;render()};label.append(input);$('identifiers').append(label)}}$('main').hidden=false;$('status').hidden=true;render()}).catch(()=>{$('status').textContent='No se pudo cargar la agenda.'});</script></html>
